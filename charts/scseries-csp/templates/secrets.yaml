{{- if not .Values.array.credentials.existingSecret }}
{{- if not (and .Values.array.host .Values.array.credentials.username .Values.array.credentials.password) }}
{{- fail "set array.host, array.credentials.username and array.credentials.password, or array.credentials.existingSecret" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "scseries-csp.backendSecret" . }}
  labels: {{- include "scseries-csp.labels" . | nindent 4 }}
type: Opaque
stringData:
  # read by the HPE CSI Driver: which CSP service to call, and the credentials it passes to it
  serviceName: {{ include "scseries-csp.serviceName" . }}
  servicePort: "8080"
  backend: {{ .Values.array.host | quote }}
  username: {{ .Values.array.credentials.username | quote }}
  password: {{ .Values.array.credentials.password | quote }}
{{- end }}
{{- if not .Values.csp.tokenKey.existingSecret }}
{{- $name := include "scseries-csp.tokenSecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "scseries-csp.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing (index $existing.data "token-key") }}
  token-key: {{ index $existing.data "token-key" }}
  {{- else }}
  token-key: {{ randAlphaNum 32 | b64enc | b64enc }}
  {{- end }}
{{- end }}
