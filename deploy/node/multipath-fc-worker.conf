# Optional: for node images that set   find_multipaths "strict"   and   blacklist { wwid ".*" }
# (claim nothing unless explicitly allowed). Install as /etc/multipath/conf.d/zz-fc-worker.conf next to
# sc-series.conf.
#
# Under "strict" only WWIDs already listed in /etc/multipath/wwids get a map, so CSI-attached SC volumes would
# never get a multipath device (the HPE node plugin does not register WWIDs). "greedy" maps every path that
# passes the blacklist; with the blanket wwid blacklist still in place only the SC volumes whitelisted in
# sc-series.conf are eligible. "greedy" rather than "on": "on" needs >= 2 paths at attach time, so a volume
# attached while one fabric is down (or on a node with a single usable HBA) would get no dm device and CSI
# staging fails with "device not found with serial".
defaults {
	find_multipaths greedy
}
