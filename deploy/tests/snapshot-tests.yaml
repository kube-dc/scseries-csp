# Snapshot/clone tests (StorageClass and VolumeSnapshotClass from the chart; names via hack/csi-e2e.sh).
# Apply in two steps (hack/csi-snapshot-test.sh does this):
#   1) class + source PVC + writer pod   2) VolumeSnapshot, restore PVC, clone PVC, reader pods
apiVersion: v1
kind: Namespace
metadata:
  name: sc-snap-test
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: src, namespace: sc-snap-test}
spec:
  storageClassName: STORAGE_CLASS
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: Pod
metadata: {name: writer, namespace: sc-snap-test}
spec:
  containers:
    - name: c
      image: docker.io/library/busybox:1.37.0
      command: ["sh", "-c", "echo ORIGINAL > /data/marker && sync && sleep 1d"]
      volumeMounts: [{name: v, mountPath: /data}]
  volumes:
    - name: v
      persistentVolumeClaim: {claimName: src}
